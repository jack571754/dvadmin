<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="keywords"
			content="django-vue3-admin"
		/>
		<meta
			name="description"
			content="django-vue-admin 基于RBAC模型的权限控制的一整套基础开发平台，权限粒度达到列级别，前后端分离，后端采用django + django-rest-framework，前端采用基于 vue3 + CompositionAPI + typescript + vite + element plus"
		/>
		<link rel="icon" href="/favicon.ico" />
		<title>django-vue-admin</title>
		<script>
			// 暗色模式在首帧之前就落到 <html> 上，否则会先渲染一帧亮色再切换。
			// 只读 themeConfig.isIsDark，与 setings.vue / shared/access/theme.ts 保持同一事实来源。
			(function () {
				try {
					var config = JSON.parse(window.localStorage.getItem('themeConfig') || '{}');
					var isDark = typeof config.isIsDark === 'boolean' ? config.isIsDark : true;
					if (isDark) {
						document.documentElement.setAttribute('data-theme', 'dark');
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
